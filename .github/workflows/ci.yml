name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/travel-multiagent
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  quality-check:
    name: Tests, Ruff and SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        run: pip install poetry

      - name: Instalar dependencias
        run: poetry install --no-interaction

      - name: Verificar calidad con Ruff
        run: poetry run ruff check .

      - name: Ejecutar pruebas y cobertura
        run: poetry run pytest --cov=travel_assistant --cov-report=term-missing --cov-report=xml

      - name: Analizar con SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}